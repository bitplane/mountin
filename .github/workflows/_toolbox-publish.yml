name: Publish toolbox

on:
  workflow_call:
    inputs:
      toolbox:
        description: Concrete docker provider to build and publish
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      destination: ${{ steps.resolve.outputs.destination }}
      documentation: ${{ steps.resolve.outputs.documentation }}
      matrix: ${{ steps.resolve.outputs.matrix }}
      release: ${{ steps.resolve.outputs.release }}
    env:
      GH_TOKEN: ${{ github.token }}
      TOOLBOX: ${{ inputs.toolbox }}
    steps:
      - name: Check out workflow
        uses: actions/checkout@v6

      - name: Resolve release and native build hosts
        id: resolve
        run: |
          set -eu

          git fetch --force --tags origin
          release=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' \
              --sort=-version:refname | head -n 1)
          test -n "$release"
          git checkout --detach "$release"

          case "$TOOLBOX" in
              docker:builder/compiler/*) ;;
              *)
                  echo "Not a compiler toolbox: $TOOLBOX" >&2
                  exit 1
                  ;;
          esac

          source_image=${TOOLBOX#docker:}
          destination="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mountin/$source_image"

          sudo apt-get update
          sudo apt-get install --yes podman python3-venv
          python3 -m venv .venv
          .venv/bin/pip install --disable-pip-version-check --editable .

          provider=$(.venv/bin/mountin-build \
              --build-platform x86_64-linux \
              outputs --verbose --all-platforms --include-unavailable | \
              awk -F '\t' -v output="$TOOLBOX" \
                  '$1 == output { print $2; exit }')
          test -n "$provider"
          documentation="https://github.com/$GITHUB_REPOSITORY/blob/$release/src/mountin/$provider/index.md"

          matrix='[]'
          while IFS='|' read -r build_platform runner oci_arch; do
              if .venv/bin/mountin-build \
                  --build-platform "$build_platform" \
                  outputs --all-platforms | grep -Fxq "$TOOLBOX"; then
                  matrix=$(jq -c \
                      --arg build_platform "$build_platform" \
                      --arg runner "$runner" \
                      --arg oci_arch "$oci_arch" \
                      '. + [{
                          build_platform: $build_platform,
                          runner: $runner,
                          oci_arch: $oci_arch
                      }]' <<<"$matrix")
              fi
          done <<'EOF'
          x86_64-linux|ubuntu-24.04|amd64
          aarch64-linux|ubuntu-24.04-arm|arm64
          EOF
          test "$matrix" != '[]'

          printf '%s' "$GH_TOKEN" | podman login ghcr.io \
              --username "$GITHUB_ACTOR" --password-stdin
          if skopeo inspect --raw "docker://$destination:$release" \
              >/dev/null 2>&1; then
              echo "Refusing to replace published toolbox: $destination:$release" >&2
              exit 1
          fi

          {
              echo "destination=$destination"
              echo "documentation=$documentation"
              echo "matrix=$matrix"
              echo "release=$release"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      DESTINATION: ${{ needs.resolve.outputs.destination }}
      GH_TOKEN: ${{ github.token }}
      RELEASE: ${{ needs.resolve.outputs.release }}
      TOOLBOX: ${{ inputs.toolbox }}
    steps:
      - name: Check out Mountin release
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE }}

      - name: Install build environment
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman python3-venv
          python3 -m venv .venv
          .venv/bin/pip install --disable-pip-version-check --editable .

      - name: Build toolbox
        run: .venv/bin/mountin-build build "$TOOLBOX"

      - name: Publish native manifest by digest
        env:
          OCI_ARCH: ${{ matrix.oci_arch }}
        run: |
          set -eu
          source_image=${TOOLBOX#docker:}
          test "$(podman image inspect --format '{{.Os}}/{{.Architecture}}' \
              "$source_image")" = "linux/$OCI_ARCH"
          podman save --format oci-archive \
              --output toolbox.oci.tar "$source_image"

          printf '%s' "$GH_TOKEN" | podman login ghcr.io \
              --username "$GITHUB_ACTOR" --password-stdin
          skopeo copy \
              --digestfile "digest-$OCI_ARCH" \
              "oci-archive:toolbox.oci.tar" \
              "docker://$DESTINATION@@unknown-digest@@"

      - name: Export native manifest digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.oci_arch }}
          path: digest-${{ matrix.oci_arch }}
          archive: false
          retention-days: 1

  publish:
    needs:
      - resolve
      - build
    runs-on: ubuntu-24.04
    env:
      DESTINATION: ${{ needs.resolve.outputs.destination }}
      DOCUMENTATION: ${{ needs.resolve.outputs.documentation }}
      GH_TOKEN: ${{ github.token }}
      RELEASE: ${{ needs.resolve.outputs.release }}
    steps:
      - name: Download native manifest digests
        uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - name: Publish multi-architecture index
        run: |
          set -eu
          printf '%s' "$GH_TOKEN" | podman login ghcr.io \
              --username "$GITHUB_ACTOR" --password-stdin

          manifest="$DESTINATION:$RELEASE"
          podman manifest create \
              --annotation "org.opencontainers.image.documentation=$DOCUMENTATION" \
              "$manifest"
          for digest_file in digests/digest-*; do
              digest=$(cat "$digest_file")
              podman manifest add "$manifest" \
                  "docker://$DESTINATION@$digest"
          done
          podman manifest push --all "$manifest" "docker://$manifest"

      - name: Verify public index
        run: |
          set -eu
          podman logout ghcr.io

          expected=$(find digests -type f -name 'digest-*' | wc -l)
          manifest=$(skopeo inspect --raw "docker://$DESTINATION:$RELEASE")
          jq -e --argjson expected "$expected" '
              .mediaType == "application/vnd.oci.image.index.v1+json" and
              (.manifests | length) == $expected
          ' <<<"$manifest" >/dev/null
          jq -e --arg documentation "$DOCUMENTATION" '
              .annotations["org.opencontainers.image.documentation"] ==
                  $documentation
          ' <<<"$manifest" >/dev/null

          for digest_file in digests/digest-*; do
              arch=${digest_file##*digest-}
              jq -e --arg arch "$arch" '
                  any(.manifests[]; .platform.os == "linux" and
                      .platform.architecture == $arch)
              ' <<<"$manifest" >/dev/null
          done

          echo "Published $DESTINATION:$RELEASE"
